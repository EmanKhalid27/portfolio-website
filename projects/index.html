<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Eman Khalid, projects, portfolio, full stack, MERN, developer" />
    <meta name="description" content="View all projects by Eman Khalid - Full-Stack Developer. Includes MERN stack, web apps, and AI/ML projects." />
    <link rel="stylesheet" href="./style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link id='favicon' rel="shortcut icon" href="/assets/images/favicon.png" type="image/x-png">
    <title>Projects | Eman Khalid</title>
</head>
<body oncontextmenu="return false">

<!-- navbar starts -->
<header>
    <a href="/" class="logo"><i class="fas fa-laptop-code"></i> Eman</a>

    <div id="menu" class="fas fa-bars"></div>
    <nav class="navbar">
        <ul>
            <li><a href="/#home">Home</a></li>
            <li><a href="/#about">About</a></li>
            <li><a href="/#skills">Skills</a></li>
            <li><a href="/#education">Education</a></li>
            <li><a class="active" href="/#work">Work</a></li>
            <li><a href="/#experience">Experience</a></li>
            <li><a href="/#contact">Contact</a></li>
        </ul>
    </nav>
</header>
<!-- navbar ends -->

<!-- work project section starts -->
<section class="work" id="work">

    <h2 class="heading"><i class="fas fa-laptop-code"></i> Projects <span>Made</span></h2>
    
    <div class="project-stats">
        <span class="stat"><i class="fas fa-code"></i> 8+ Projects</span>
        <span class="stat"><i class="fas fa-users"></i> 5+ Technologies</span>
    </div>

    <div id="filters" class="button-group">
        <button class="btn is-checked" data-filter="*">All Projects</button>
        <button class="btn" data-filter=".mern">MERN Stack</button>
        <button class="btn" data-filter=".ai,.ml">AI & ML</button>
        <button class="btn" data-filter=".desktop">Desktop</button>
        <button class="btn" data-filter=".basicweb">Web Apps</button>
    </div>

    <div class="box-container">
        <!-- Projects will be loaded dynamically from projects.json -->
    </div>

    <div class="backbtn">
        <a href="/#work" class="btn">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Home</span>
        </a>
    </div>

</section>
<!-- work project section ends -->

<!-- scroll top btn -->
<a href="#work" class="fas fa-angle-up" id="scroll-top"></a>
<!-- scroll back to top -->
